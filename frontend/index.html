<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ModelForge</title>
<style>
:root{--bg:#0b0d10;--surface:#12161b;--raised:#181e25;--border:#252d37;--text:#e8edf3;--muted:#8b96a5;--primary:#8290ff;--ok:#32d583;--warn:#fdb022;--danger:#f97066}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--text);font:14px/1.6 Inter,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
main{max-width:900px;margin:0 auto;padding:20px 24px 64px}
a{color:var(--primary)}
h2{font-size:15px;font-weight:700;margin:0}
button{border:1px solid var(--border);background:var(--raised);color:var(--text);padding:8px 13px;border-radius:8px;cursor:pointer;font-size:13px}
button:hover{border-color:#39424f}
button.primary{background:var(--primary);color:#0b0d10;border:0;font-weight:700}
button.mini{padding:5px 10px;font-size:12px}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{width:100%;padding:9px 10px;background:#0e1216;border:1px solid var(--border);border-radius:7px;color:var(--text);font:inherit}
select{cursor:pointer}
.muted{color:var(--muted)}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--danger)}
.grow{flex:1}
.status{display:flex;align-items:center;gap:9px;padding:2px 2px 14px;color:var(--muted);font-size:13px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}
.hw{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:16px}
.hwi{background:var(--surface);padding:12px 14px;min-width:0}
.hwi .k{color:var(--muted);font-size:11px;letter-spacing:.04em}
.hwi .v{font-size:15px;font-weight:650;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hwi .s{color:var(--muted);font-size:11px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:14px}
.card .head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.card .head select{width:auto;padding:6px 9px}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{min-width:0}
.field.wide{grid-column:1/-1}
.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}
.pick{padding:2px 0}
.pickname{font-size:19px;font-weight:750}
.reason{display:inline-block;margin-top:8px;padding:4px 9px;border-radius:6px;background:#1d2340;color:#c7cdfd;font-size:12px}
.tag{font-size:11px;padding:2px 7px;border-radius:5px;background:#252b53;color:#b9c2ff;display:inline-block;margin:2px 3px 2px 0}
.tag.ok{background:#12352a;color:#6ee7b7}.tag.warn{background:#3a2c12;color:#fcd34d}.tag.bad{background:#3a1a1a;color:#fca5a5}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);font-weight:600;padding:7px 6px;border-bottom:1px solid var(--border)}
td{padding:9px 6px;border-bottom:1px solid #1b222a;vertical-align:top}
tr.spill{opacity:.62}
.log{font:12px/1.85 ui-monospace,SFMono-Regular,monospace;color:#aeb8c5;background:#0a0d10;border:1px solid var(--border);border-radius:8px;padding:11px;white-space:pre-wrap;word-break:break-word;margin:0}
.reply{background:#0f1a14;border:1px solid #1f3b2c;border-radius:8px;padding:11px;margin-top:10px;white-space:pre-wrap}
pre{white-space:pre-wrap;background:#0a0d10;border:1px solid var(--border);padding:12px;border-radius:8px;color:#b9c2ff;font-size:12px;word-break:break-all;margin:0}
.advisory{border:1px solid #5c4718;background:#221a0c;border-radius:8px;padding:12px;margin-bottom:12px}
details.card>summary{cursor:pointer;color:var(--muted);font-size:13px;list-style:none;user-select:none}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary:before{content:"\25B8  ";color:var(--primary)}
details.card[open]>summary:before{content:"\25BE  "}
details.card>summary:hover{color:var(--text)}
details.card[open]>summary{margin-bottom:12px}
@media(max-width:760px){main{padding:16px}.hw,.form{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.hw,.form{grid-template-columns:1fr}}
</style></head>
<body><main>

<div class="status">
  <span class="dot" id="status-dot"></span>
  <span id="status-text">正在检测…</span>
  <span class="grow"></span>
  <button class="mini" onclick="refresh()">重新检测</button>
</div>

<div class="hw">
  <div class="hwi"><div class="k">设备</div><div class="v" id="hw-device">—</div><div class="s" id="hw-type"></div></div>
  <div class="hwi"><div class="k">可用预算</div><div class="v" id="hw-budget">—</div><div class="s" id="hw-total"></div></div>
  <div class="hwi"><div class="k">硬件来源</div><div class="v" id="hw-source">—</div><div class="s" id="hw-trust"></div></div>
  <div class="hwi"><div class="k">运行服务</div><div class="v" id="hw-running">0</div><div class="s">当前部署实例</div></div>
</div>

<section class="card">
  <div class="head">
    <h2>推荐模型</h2>
    <select id="backend" onchange="refresh()" style="margin-left:auto;width:auto">
      <option value="ollama">ollama</option><option value="llama.cpp">llama.cpp</option>
      <option value="transformers">transformers</option><option value="vllm">vllm</option><option value="sglang">sglang</option>
    </select>
  </div>
  <div class="pick" id="pick">加载中…</div>
  <div class="actions"><button class="primary" onclick="usePick()">部署这个模型</button></div>
</section>

<section class="card" id="deploy">
  <div class="head">
    <h2>部署</h2>
    <span class="muted" id="deploy-sub">创建 → 启动 → 健康检查</span>
    <span class="grow"></span>
    <button class="primary" id="deploy-btn" onclick="createDeploy()">创建并启动</button>
  </div>
  <div id="deploy-advisory" class="advisory" style="display:none">
    <div class="muted">服务端不能把模型部署到你的机器上。请在本机执行：</div>
    <pre id="advisory-cmd" style="margin-top:8px">—</pre>
    <div class="actions"><button class="mini" onclick="copyAdvisory()">复制命令</button></div>
  </div>
  <div class="form">
    <div class="field wide"><label>模型</label><select id="d-model" onchange="syncDeploy()"></select></div>
    <div class="field"><label>后端</label><select id="d-backend" onchange="syncDeploy()">
      <option value="ollama">ollama</option><option value="llama.cpp">llama.cpp</option>
      <option value="transformers">transformers</option><option value="vllm">vllm</option><option value="sglang">sglang</option></select></div>
    <div class="field"><label>端口</label><input id="d-port" type="number" value="11434"></div>
    <div class="field wide"><label>模型路径 / Ollama 标签</label><input id="d-path" value="qwen3:8b"></div>
    <div class="field wide"><label>模型名（OpenAI 请求用）</label><input id="d-name" value="qwen3:8b"></div>
  </div>
  <div id="d-list" class="log" style="margin-top:14px">暂无部署</div>
  <div class="muted" style="font-size:12px;margin:12px 0 5px">最近日志</div>
  <div id="d-log" class="log">—</div>
</section>

<section class="card" id="service">
  <div class="head">
    <h2>服务测试</h2>
    <span class="grow"></span>
    <span class="muted" id="svc-state">● 暂无运行服务</span>
  </div>
  <div class="form">
    <div class="field"><label>部署实例</label><select id="t-dep"></select></div>
    <div class="field"><label>模型名</label><input id="t-model" value="qwen3:8b"></div>
    <div class="field wide"><label>提示词</label><textarea id="t-msg" rows="2">你好，请用一句话介绍你自己</textarea></div>
    <div class="field"><label>最大 Token</label><input id="t-max" type="number" value="512"></div>
    <div class="field" style="display:flex;align-items:flex-end;gap:8px">
      <button class="primary" onclick="runTest()">发送测试</button>
      <button class="mini" onclick="healthCheck()">健康检查</button>
    </div>
  </div>
  <div class="muted" style="font-size:12px;margin:12px 0 5px">API 地址</div>
  <pre id="t-endpoint">—</pre>
  <div class="muted" style="font-size:12px;margin:12px 0 5px">回复</div>
  <div id="t-out" class="log">尚未测试</div>
</section>

<details class="card"><summary>预算与警告</summary><div class="log" id="budget-log" style="margin-top:12px">—</div></details>

<details class="card"><summary>全部候选模型</summary><div id="rows" style="margin-top:12px">加载中…</div></details>

<details class="card" id="profile"><summary>硬件档案 · 手动修正 / 本机精确探测</summary>
  <div class="form">
    <div class="field"><label>平台</label><select id="pf-platform"><option value="darwin">darwin</option><option value="win32">win32</option><option value="linux">linux</option><option value="unknown">unknown</option></select></div>
    <div class="field"><label>架构</label><input id="pf-arch" placeholder="arm64 / x86_64"></div>
    <div class="field"><label>CPU 核数</label><input id="pf-cores" type="number" min="1" max="1024"></div>
    <div class="field"><label>内存 (GB)</label><input id="pf-ram" type="number" step="0.5" min="0.5" max="4096"></div>
    <div class="field wide"><label>常见内存档位</label><div id="pf-presets"></div></div>
    <div class="field wide"><label>GPU 名称</label><input id="pf-gpu" placeholder="Apple M4 Pro / NVIDIA GeForce RTX 4090"></div>
    <div class="field"><label>显存 (GB，统一内存留空)</label><input id="pf-vram" type="number" step="0.5" min="0.5" max="4096"></div>
    <div class="field"><label>统一内存 (UMA)</label><select id="pf-uma"><option value="true">是</option><option value="false">否</option></select></div>
    <div class="field wide"><label>档案码 / 粘贴的 JSON</label><textarea id="pf-code" rows="2" placeholder="mdp1.xxxx.yyyy"></textarea></div>
  </div>
  <div class="actions">
    <button class="primary" onclick="applyProfileForm()">应用并重新推荐</button>
    <button class="mini" onclick="runBrowserProbe()">重新检测本机</button>
    <button class="mini" onclick="copyCode()">生成档案码</button>
    <button class="mini" onclick="parseCode()">解析粘贴内容</button>
  </div>
  <div class="muted" style="font-size:12px;margin:12px 0 5px">归一化结果</div>
  <div id="pf-out" class="log">—</div>
  <div class="muted" style="font-size:12px;margin:12px 0 5px">本机精确探测（在你自己的机器上执行，把输出粘回上方）</div>
  <pre id="pf-cmd">—</pre>
  <div class="actions"><button class="mini" onclick="copyProbe()">复制探测命令</button></div>
</details>

<details class="card"><summary>环境检测 · 服务器</summary>
  <div class="log" id="checks" style="margin-top:12px">—</div>
  <div class="muted" style="font-size:12px;margin:12px 0 5px">原始报告</div>
  <pre id="raw-env">—</pre>
</details>

</main>
<script>
function jump(id){
  var el=document.getElementById(id);
  if(!el){return;}
  if(el.tagName==='DETAILS'){el.open=true;}
  el.scrollIntoView({behavior:'smooth',block:'start'});
}
function fmt(gb){return (gb===null||gb===undefined)?'—':gb+' GB';}
function esc(s){return String(s===undefined||s===null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function badge(t,cls){return '<span class="tag '+(cls||'')+'">'+esc(t)+'</span>';}
function copyText(text){
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text);return;}
  var ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();
}
var LAST=null, DEPLOYMENTS=[], CONFIG={}, PROFILE={source:'browser',platform:'unknown',architecture:'',cpu_cores:null,ram_gb:null,gpus:[]}, GPU_TABLE=null;

function detectGPUName(){
  try{
    var c=document.createElement('canvas');
    var gl=c.getContext('webgl')||c.getContext('experimental-webgl');
    if(!gl){return '';}
    var ext=gl.getExtension('WEBGL_debug_renderer_info');
    if(ext){return gl.getParameter(ext.UNMASKED_RENDERER_WEBGL)||'';}
    return gl.getParameter(gl.RENDERER)||'';
  }catch(e){return '';}
}
async function resolveGPU(name){
  if(!GPU_TABLE){try{GPU_TABLE=await (await fetch('/api/hardware/gpus')).json();}catch(e){GPU_TABLE={gpus:[]};}}
  var n=(name||'').toLowerCase();
  var list=GPU_TABLE.gpus||[];
  for(var i=0;i<list.length;i++){if(n.indexOf(list[i].key)>=0){return list[i];}}
  return null;
}
async function runBrowserProbe(){
  var ua=navigator.userAgent||'';
  var p={source:'browser',platform:'unknown',architecture:'',cpu_cores:navigator.hardwareConcurrency||null,ram_gb:(navigator.deviceMemory||null),gpus:[]};
  if(navigator.deviceMemory===undefined){p.ram_source='unavailable';}
  else if(navigator.deviceMemory>=8){p.ram_source='capped';}
  else{p.ram_source='bucket';}
  if(/Mac OS X|Macintosh/.test(ua)){p.platform='darwin';}
  else if(/Windows/.test(ua)){p.platform='win32';}
  else if(/Linux/.test(ua)){p.platform='linux';}
  if(navigator.userAgentData&&navigator.userAgentData.getHighEntropyValues){
    try{
      var h=await navigator.userAgentData.getHighEntropyValues(['architecture','bitness']);
      if(h.architecture){p.architecture=h.architecture+(h.bitness==='64'?'64':'');}
    }catch(e){}
  }
  var gpuName=detectGPUName();
  if(gpuName){
    var info=await resolveGPU(gpuName);
    p.gpus.push({name:gpuName,vendor:(info&&info.vendor)||'unknown',vram_gb:(info&&info.vram_gb)||null,uma:!!(info&&info.uma)});
  }
  PROFILE=p;
  fillProfileForm();
  await resolveProfile();
}
function fillProfileForm(){
  document.getElementById('pf-platform').value=PROFILE.platform||'unknown';
  document.getElementById('pf-arch').value=PROFILE.architecture||'';
  document.getElementById('pf-cores').value=PROFILE.cpu_cores||'';
  document.getElementById('pf-ram').value=PROFILE.ram_gb||'';
  var g=(PROFILE.gpus&&PROFILE.gpus[0])||null;
  document.getElementById('pf-gpu').value=g?g.name:'';
  document.getElementById('pf-vram').value=(g&&g.vram_gb)?g.vram_gb:'';
  document.getElementById('pf-uma').value=(g&&g.uma)?'true':'false';
}
function applyProfileForm(){
  var gpu=document.getElementById('pf-gpu').value.trim();
  var vram=document.getElementById('pf-vram').value;
  var uma=document.getElementById('pf-uma').value==='true';
  PROFILE={
    source:'manual',
    platform:document.getElementById('pf-platform').value,
    architecture:document.getElementById('pf-arch').value.trim(),
    cpu_cores:+document.getElementById('pf-cores').value||null,
    ram_gb:+document.getElementById('pf-ram').value||null,
    gpus:gpu?[{name:gpu,vendor:'unknown',vram_gb:vram?+vram:null,uma:uma}]:[]
  };
  resolveProfile();
}
async function resolveProfile(){
  try{
    var d=await (await fetch('/api/hardware/resolve',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({hardware:PROFILE})})).json();
    var b=d.budget||{};
    document.getElementById('pf-out').textContent=
      'source: '+d.source+'\ntrusted: '+d.trusted+'\numa: '+b.uma+
      '\nusable_vram_gb: '+b.usable_vram_gb+'\ntotal_device_gb: '+b.total_device_gb+
      '\ndevice: '+b.device_name+
      ((d.warnings&&d.warnings.length)?'\n\n警告:\n- '+d.warnings.join('\n- '):'')+
      ramHint();
  }catch(e){document.getElementById('pf-out').textContent='解析失败：'+e;}
  refresh();
}
async function copyCode(){
  try{
    var d=await (await fetch('/api/hardware/profile-code',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({profile:PROFILE})})).json();
    document.getElementById('pf-code').value=d.code;
    copyText(d.code);
  }catch(e){}
}
async function parseCode(){
  var text=document.getElementById('pf-code').value.trim();
  if(!text){return;}
  try{
    var r=await fetch('/api/hardware/parse',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text:text})});
    var d=await r.json();
    if(!r.ok){document.getElementById('pf-out').textContent='解析失败：'+(d.detail||r.status);return;}
    PROFILE=d.profile;
    fillProfileForm();
    await resolveProfile();
  }catch(e){document.getElementById('pf-out').textContent='解析失败：'+e;}
}
async function loadProbeCommand(){
  try{
    var d=await (await fetch('/api/hardware/probe-command')).json();
    document.getElementById('pf-cmd').textContent=d.command;
  }catch(e){}
}
function copyProbe(){copyText(document.getElementById('pf-cmd').textContent);}
function ramHint(){
  if(PROFILE.ram_source==='unavailable'){return '\n\n提示：你的浏览器不提供内存信息，请手动选择档位或用本机探测。';}
  if(PROFILE.ram_source==='capped'){return '\n\n提示：浏览器内存档位封顶 8GB；若实际更大，请用上方档位或本机探测确认。';}
  return '';
}
function quickRam(gb){
  document.getElementById('pf-ram').value=gb;
  document.getElementById('pf-uma').value='true';
  if(!document.getElementById('pf-gpu').value.trim()){
    document.getElementById('pf-gpu').value='Apple GPU';
  }
  applyProfileForm();
}
function renderPresets(){
  var sizes=[8,16,18,24,32,36,48,64,96,128];
  document.getElementById('pf-presets').innerHTML=sizes.map(function(s){
    return '<button class="mini" style="margin:2px" onclick="quickRam('+s+')">'+s+' GB</button>';
  }).join('');
}

async function refresh(){
  var backend=document.getElementById('backend').value||'ollama';
  var env,rec;
  try{env=await (await fetch('/api/environment/latest')).json();}catch(e){env=null;}
  try{
    rec=await (await fetch('/api/models/recommend',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({task:'chat',goal:'balanced',backend:backend,limit:40,hardware:PROFILE})})).json();
  }catch(e){rec=null;}
  LAST=rec;
  if(env){
    var g=(env.gpu&&env.gpu[0])||null;
    document.getElementById('checks').innerHTML=(env.checks||[]).map(function(c){
      var mark=c.status==='PASS'?'[PASS] ':c.status==='NOT_APPLICABLE'?'[N/A]  ':'[WARN] ';
      return esc(mark+c.name+'  '+c.message);}).join('<br>');
    document.getElementById('raw-env').textContent=JSON.stringify(env,null,2);
  }
  if(rec){
    var h=rec.hardware||{};
    document.getElementById('hw-device').textContent=h.device_name||'—';
    document.getElementById('hw-type').textContent=(h.uma?'统一内存':'独立显存')+' · '+(rec.normalized_profile&&rec.normalized_profile.architecture||'');
    document.getElementById('hw-budget').textContent=fmt(h.usable_vram_gb);
    document.getElementById('hw-total').textContent='总容量 '+fmt(h.total_device_gb);
    document.getElementById('hw-source').textContent=(rec.hardware_source||'—');
    document.getElementById('hw-trust').textContent=rec.hardware_trusted?'服务器实测':'客户端提交，需确认';
    var warn=(rec.hardware_warnings||[]);
    document.getElementById('budget-log').textContent=
      'source: '+rec.hardware_source+'\nclient_is_local: '+rec.client_is_local+
      '\nusable_vram_gb: '+h.usable_vram_gb+'\ntotal_device_gb: '+h.total_device_gb+
      '\numa: '+h.uma+'\ncomfort_decode_tok_s: '+rec.comfort_decode_tok_s+
      ((warn.length)?'\n\n警告:\n- '+warn.join('\n- '):'');
    renderStatus(rec);
    renderPick(rec); renderRows(rec); fillDeployModels(rec);
  } else {
    document.getElementById('pick').textContent='后端未启动';
    document.getElementById('rows').textContent='后端未启动';
  }
  refreshDeployments();
}
function renderStatus(rec){
  var dot=document.getElementById('status-dot');
  var text=document.getElementById('status-text');
  if(rec.client_is_local){
    dot.className='dot ok';
    text.textContent='已检测本机 · 显示的是这台机器的硬件';
  } else {
    dot.className='dot warn';
    text.innerHTML='共享服务 · 显示的是你自己的硬件档案（来源：'+esc(rec.hardware_source)+'）'+
      ' · <a href="#" onclick="jump(\'profile\');return false">去检测我的机器</a>';
  }
}
function renderPick(rec){
  var p=rec.recommendation;
  if(!p){
    var usable=(rec.hardware&&rec.hardware.usable_vram_gb)||0;
    if(usable<=0){
      document.getElementById('pick').innerHTML='<div class="warn">还差一个内存档位</div>'+
        '<div class="muted">浏览器无法读取你的内存容量，请选择本机内存：</div>'+
        '<div style="margin-top:10px">'+[8,16,24,32,36,48,64,96,128].map(function(s){return '<button class="mini" style="margin:2px" onclick="quickRam('+s+')">'+s+' GB</button>';}).join('')+'</div>'+
        '<div class="muted" style="margin-top:8px">也可以到「硬件档案」粘贴本机探测结果，得到精确结果。</div>';
      return;
    }
    document.getElementById('pick').innerHTML='<div class="warn">无自动推荐</div><div class="muted">'+esc(rec.reason)+'</div>';
    return;
  }
  var html='<div style="font-size:18px;font-weight:700">'+esc(p.name)+'</div>';
  html+='<div class="muted">'+esc(p.id)+' · '+esc(p.params_b)+'B · 质量 '+esc(p.quality)+'</div>';
  html+='<div>'+badge(p.quantization,'ok')+badge('零溢出','ok')+badge('窗口 '+p.planned_window)+badge('KV '+p.kv_quant)+(p.moe?badge('MoE'):'')+'</div>';
  html+='<div class="reason">'+esc(rec.reason_key)+' · '+esc(rec.reason)+'</div>';
  document.getElementById('pick').innerHTML=html;
}
function renderRows(rec){
  var rows=rec.recommendations||[];
  var html='<table><thead><tr><th>模型</th><th>量化</th><th>体积</th><th>质量</th><th>驻留</th><th>原因</th></tr></thead><tbody>';
  rows.forEach(function(r){
    var cls=r.zero_spill?'':'spill';
    var resident=r.zero_spill?badge('零溢出','ok'):(r.fits?badge('溢出 '+r.spill_gb+'GB','warn'):badge('物理拒绝','bad'));
    html+='<tr class="'+cls+'"><td>'+(r.recommended?badge('自动推荐','ok'):'')+'<b>'+esc(r.name)+'</b><div class="muted">'+esc(r.id)+'</div></td>';
    html+='<td>'+badge(r.quantization)+'</td><td>'+esc(r.memory_gb)+' GB</td><td>'+esc(r.quality)+'</td>';
    html+='<td>'+resident+'</td><td><div class="muted">'+esc(r.reason)+'</div></td></tr>';
  });
  document.getElementById('rows').innerHTML=html+'</tbody></table>';
}
// The model payload lives here and each option carries only its index.
// Serialising JSON into a value="..." attribute made the browser truncate it
// at the first quote, so option.value was "{" and JSON.parse always threw.
var DEPLOY_MODELS=[];
function fillDeployModels(rec){
  var sel=document.getElementById('d-model');
  var rows=(rec.recommendations||[]).filter(function(r){return r.fits;});
  DEPLOY_MODELS=rows.map(function(r){
    return {id:r.id,name:r.name,ollama:(r.source&&r.source.ollama)||'',path:(r.source&&r.source.huggingface)||r.id};
  });
  sel.innerHTML=rows.map(function(r,i){
    return '<option value="'+i+'">'+esc(r.name)+' · '+esc(r.quantization)+(r.recommended?' ★':'')+'</option>';
  }).join('');
  syncDeploy();
}
// Both backend dropdowns were hardcoded to the full list, so an unavailable
// backend could be picked and the deployment only failed at start. The data was
// already being fetched into CONFIG; this is what uses it.
var ALL_BACKENDS=['ollama','llama.cpp','transformers','vllm','sglang'];
function backendNote(b,available,installed){
  if(!available||available.indexOf(b)>=0){return '';}
  if(installed&&installed.indexOf(b)>=0){return ' · 桌面端不支持';}
  return ' · 本机未安装';
}
function fillBackends(){
  var available=(CONFIG&&CONFIG.backends&&CONFIG.backends.length)?CONFIG.backends:null;
  var installed=(CONFIG&&CONFIG.installed)||[];
  ['backend','d-backend'].forEach(function(id){
    var sel=document.getElementById(id);
    if(!sel){return;}
    var current=sel.value;
    sel.innerHTML=ALL_BACKENDS.map(function(b){
      var ok=!available||available.indexOf(b)>=0;
      return '<option value="'+b+'"'+(ok?'':' disabled')+'>'+b+backendNote(b,available,installed)+'</option>';
    }).join('');
    // Keep the previous choice when it is still selectable, otherwise fall to
    // the first backend that actually works.
    var want=sel.querySelector('option[value="'+current+'"]');
    if(want&&!want.disabled){sel.selectedIndex=want.index;return;}
    var first=sel.querySelector('option:not([disabled])');
    if(first){sel.selectedIndex=first.index;}
  });
}
function currentModel(){
  var sel=document.getElementById('d-model');
  if(sel.value===''){return null;}
  return DEPLOY_MODELS[+sel.value]||null;
}
function syncDeploy(){
  var m=currentModel(); if(!m) return;
  var backend=document.getElementById('d-backend').value;
  if(backend==='ollama'){
    document.getElementById('d-port').value=11434;
    document.getElementById('d-path').value=m.ollama||m.id;
    document.getElementById('d-name').value=m.ollama||m.id;
  } else {
    document.getElementById('d-path').value=m.path||m.id;
    document.getElementById('d-name').value=m.id;
  }
  refreshAdvisory();
}
async function refreshAdvisory(){
  var remote=LAST&&LAST.client_is_local===false;
  var allowed=CONFIG.allow_remote_deploy===true;
  var advisory=document.getElementById('deploy-advisory');
  var btn=document.getElementById('deploy-btn');
  if(remote&&!allowed){
    advisory.style.display='block';
    btn.disabled=true;
    document.getElementById('deploy-sub').textContent='共享服务下只能检索；请在本机执行命令。';
    var m=currentModel();
    try{
      var d=await (await fetch('/api/plans/preview',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({
        model_id:m?m.id:'custom',model_path:document.getElementById('d-path').value,
        backend:document.getElementById('d-backend').value,port:+document.getElementById('d-port').value,hardware:PROFILE})})).json();
      document.getElementById('advisory-cmd').textContent=d.command_string;
    }catch(e){}
  } else {
    advisory.style.display='none';
    btn.disabled=false;
    document.getElementById('deploy-sub').textContent='创建 → 启动 → 健康检查 → OpenAI 兼容接口。';
  }
}
function copyAdvisory(){copyText(document.getElementById('advisory-cmd').textContent);}
function usePick(){
  var rec=LAST; if(!rec||!rec.recommendation){return;}
  var sel=document.getElementById('d-model');
  for(var i=0;i<sel.options.length;i++){try{var v=JSON.parse(sel.options[i].value);if(v.id===rec.recommendation.id){sel.selectedIndex=i;break;}}catch(e){}}
  syncDeploy();
  jump('deploy');
}
async function refreshDeployments(){
  try{DEPLOYMENTS=(await (await fetch('/api/deployments')).json()).deployments||[];}catch(e){DEPLOYMENTS=[];}
  var running=DEPLOYMENTS.filter(function(d){return d.status==='RUNNING';}).length;
  document.getElementById('hw-running').textContent=running;
  document.getElementById('svc-state').textContent=running?'● '+running+' 个服务运行中':'● 暂无运行服务';
  var html='<table><thead><tr><th>ID</th><th>模型</th><th>后端</th><th>状态</th><th>接口</th><th>操作</th></tr></thead><tbody>';
  DEPLOYMENTS.forEach(function(d){
    var cls=d.status==='RUNNING'?'ok':(d.status==='FAILED'||d.status==='BLOCKED'?'bad':'warn');
    html+='<tr><td>'+esc(d.id)+'</td><td>'+esc(d.model_path)+'</td><td>'+esc(d.backend)+'</td>';
    html+='<td><span class="'+cls+'">'+esc(d.status)+'</span></td><td class="muted">'+esc(d.endpoint)+'</td>';
    html+='<td><button class="mini" onclick="depStart(\''+d.id+'\')">启动</button> <button class="mini" onclick="depStop(\''+d.id+'\')">停止</button> <button class="mini" onclick="depLogs(\''+d.id+'\')">日志</button> <button class="mini" onclick="depDelete(\''+d.id+'\')">删除</button></td></tr>';
  });
  document.getElementById('d-list').innerHTML=DEPLOYMENTS.length?html+'</tbody></table>':'暂无部署';
  clearTimeout(window.__depPoll);
  if(DEPLOYMENTS.some(function(d){return d.status==='STARTING';})){window.__depPoll=setTimeout(refreshDeployments,3000);}
  var tsel=document.getElementById('t-dep');
  tsel.innerHTML=DEPLOYMENTS.map(function(d){return '<option value="'+esc(d.id)+'" data-model="'+esc(d.model_path)+'">'+esc(d.id)+' · '+esc(d.model_path)+' · '+esc(d.status)+'</option>';}).join('');
  onTestDepChange();
}
function onTestDepChange(){
  var sel=document.getElementById('t-dep');
  var opt=sel.options[sel.selectedIndex];
  if(opt&&opt.dataset.model){document.getElementById('t-model').value=opt.dataset.model;}
  var d=DEPLOYMENTS.filter(function(x){return x.id===sel.value;})[0];
  document.getElementById('t-endpoint').textContent=d?d.endpoint+'\n健康检查: '+d.health_endpoint:'—';
}
function depLogs(id){var d=DEPLOYMENTS.filter(function(x){return x.id===id;})[0];document.getElementById('d-log').textContent=(d&&d.log&&d.log.length)?d.log.join('\n'):'（无日志）';}
async function depStart(id){await fetch('/api/deployments/'+id+'/start',{method:'POST'});refreshDeployments();}
async function depStop(id){await fetch('/api/deployments/'+id+'/stop',{method:'POST'});refreshDeployments();}
async function depDelete(id){
  if(!confirm('删除部署 '+id+'？正在运行的会先停止。')){return;}
  try{
    var r=await fetch('/api/deployments/'+id,{method:'DELETE'});
    if(!r.ok){var d=await r.json().catch(function(){return {};});document.getElementById('d-log').textContent='删除失败：'+(d.detail||r.status);return;}
    document.getElementById('d-log').textContent='已删除 '+id;
  }catch(e){document.getElementById('d-log').textContent='删除失败：'+e;}
  refreshDeployments();
}
async function createDeploy(){
  var m=currentModel();
  var body={model_path:document.getElementById('d-path').value,model_id:m?m.id:'custom',
    model_name:document.getElementById('d-name').value,backend:document.getElementById('d-backend').value,
    port:+document.getElementById('d-port').value};
  try{
    var r=await fetch('/api/deployments',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
    var d=await r.json();
    if(!r.ok){document.getElementById('d-log').textContent='被拒绝：'+(d.detail||r.status);return;}
    document.getElementById('d-log').textContent='已创建 '+d.id+'，正在启动…';
    await fetch('/api/deployments/'+d.id+'/start',{method:'POST'});
    await refreshDeployments();
    depLogs(d.id);
  }catch(e){document.getElementById('d-log').textContent='创建失败：'+e;}
}
async function runTest(){
  var id=document.getElementById('t-dep').value;
  if(!id){document.getElementById('t-out').textContent='请先创建部署';return;}
  document.getElementById('t-out').textContent='请求中…';
  try{
    var r=await (await fetch('/api/deployments/'+id+'/test',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({
      message:document.getElementById('t-msg').value,model_name:document.getElementById('t-model').value,max_tokens:+document.getElementById('t-max').value})})).json();
    if(r.ok){document.getElementById('t-out').innerHTML='<span class="ok">'+esc(r.status_code)+' '+esc(r.url)+'</span>'+(r.reply_source==='reasoning'?'<span class="warn"> · 来自思考内容</span>':'')+'<div class="reply">'+esc(r.reply)+'</div>'+(r.hint?'<div class="warn">'+esc(r.hint)+'</div>':'')+'<div class="muted">'+esc(JSON.stringify(r.usage))+'</div>';}
    else{document.getElementById('t-out').innerHTML='<span class="bad">失败</span> '+esc(r.error||r.status_code);}
  }catch(e){document.getElementById('t-out').textContent='请求失败：'+e;}
}
async function healthCheck(){
  var id=document.getElementById('t-dep').value; if(!id){return;}
  var r=await (await fetch('/api/deployments/'+id+'/health')).json();
  document.getElementById('t-out').innerHTML=(r.healthy?'<span class="ok">健康</span>':'<span class="bad">不健康</span>')+' '+esc(r.url)+' '+esc(r.error||r.status_code||'');
}
document.getElementById('t-dep').addEventListener('change',onTestDepChange);
(async function init(){
  try{CONFIG=await (await fetch('/api/backends')).json();}catch(e){CONFIG={};}
  fillBackends();
  renderPresets();
  await runBrowserProbe();
  loadProbeCommand();
})();
</script>
</body>
