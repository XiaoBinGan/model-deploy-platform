<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Qwen3 8B 一键下载并部署流程</title>
  <desc id="desc">从选择模型到下载 GGUF、创建部署并通过 OpenAI 兼容接口完成推理的流程图。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#059669"/><stop offset="1" stop-color="#047857"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7c3aed"/><stop offset="1" stop-color="#6d28d9"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#64748b"/></marker>
    <style>
      .title{font:700 28px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f8fafc}
      .subtitle{font:400 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#94a3b8}
      .label{font:700 19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#fff;text-anchor:middle}
      .detail{font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#dbeafe;text-anchor:middle}
      .arrow{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .number{font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#fff;text-anchor:middle}
    </style>
  </defs>
  <rect width="1200" height="760" rx="24" fill="url(#bg)"/>
  <text x="60" y="62" class="title">Qwen3 8B · 一键下载并部署</text>
  <text x="60" y="92" class="subtitle">从模型推荐到本地 OpenAI 兼容推理接口</text>

  <path class="arrow" d="M600 178 L600 218"/>
  <path class="arrow" d="M600 318 L600 358"/>
  <path class="arrow" d="M600 458 L600 498"/>
  <path class="arrow" d="M600 598 L600 638"/>

  <g filter="url(#shadow)">
    <rect x="230" y="118" width="740" height="100" rx="18" fill="url(#blue)"/>
    <circle cx="275" cy="168" r="22" fill="#ffffff" fill-opacity=".18"/><text x="275" y="174" class="number">1</text>
    <text x="600" y="157" class="label">选择模型</text>
    <text x="600" y="184" class="detail">Qwen3 8B · GGUF · q4_k_m　→　⤓ 自动下载并部署</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="230" y="258" width="740" height="100" rx="18" fill="url(#purple)"/>
    <circle cx="275" cy="308" r="22" fill="#ffffff" fill-opacity=".18"/><text x="275" y="314" class="number">2</text>
    <text x="600" y="297" class="label">确认并下载 GGUF</text>
    <text x="600" y="324" class="detail">Qwen/Qwen3-8B-GGUF　·　Qwen3-8B-Q4_K_M.gguf　·　4.68 GB</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="230" y="398" width="740" height="100" rx="18" fill="url(#green)"/>
    <circle cx="275" cy="448" r="22" fill="#ffffff" fill-opacity=".18"/><text x="275" y="454" class="number">3</text>
    <text x="600" y="437" class="label">自动填路径并创建</text>
    <text x="600" y="464" class="detail">~/.mdp-models/Qwen--Qwen3-8B-GGUF/　→　创建并启动</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="230" y="538" width="740" height="100" rx="18" fill="url(#blue)"/>
    <circle cx="275" cy="588" r="22" fill="#ffffff" fill-opacity=".18"/><text x="275" y="594" class="number">4</text>
    <text x="600" y="577" class="label">部署运行</text>
    <text x="600" y="604" class="detail">llama.cpp　·　RUNNING　·　真实健康检查</text>
  </g>

  <rect x="230" y="668" width="740" height="52" rx="14" fill="#0f766e" fill-opacity=".9"/>
  <text x="600" y="701" class="label" style="font-size:17px">/v1/chat/completions　→　真实模型回复</text>
</svg>
